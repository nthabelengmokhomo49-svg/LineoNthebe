<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Contact Discover Lesotho with your travel questions and feedback.">
  <title>Contact Us | Discover Lesotho</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="ex.css">
</head>

<body>
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container">
        <a class="navbar-brand fw-bold" href="home.html">Lesotho</a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNavigation"
          aria-controls="mainNavigation"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavigation">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="home.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="about us.html">About us</a></li>
            <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
            <li class="nav-item"><a class="nav-link" href="gallery2.html">Gallery</a></li>
          
            
          </ul>

          <button
            class="btn btn-outline-light btn-sm ms-lg-3"
            id="themeButton"
            type="button"
            aria-pressed="false"
          >
            Dark mode
          </button>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <section class="contact-hero">
      <div class="container">
        <h1>Get in Touch</h1>
      </div>
    </section>

    <section class="section-space">
      <div class="container">
        <div class="row g-4">
          <div class="col-lg-6">
            <form id="registrationForm" class="contact-form">
              <h2>Registration Form</h2>

              <label for="fullName">Full name</label>
              <input id="fullName" name="fullName" type="text" required minlength="2">

              <label for="regEmail">Email</label>
              <input id="regEmail" name="email" type="email" required>

              <label for="phone">Phone</label>
              <input id="phone" name="phone" type="tel" required pattern="[0-9+\-\s()]{7,}">

              <label for="password">Password</label>
              <input id="password" name="password" type="password" required minlength="8">

              <label for="confirmPassword">Confirm password</label>
              <input id="confirmPassword" name="confirmPassword" type="password" required>

              <button class="btn btn-gold mt-3" type="submit">Register</button>
              <p id="registrationMessage" class="message" aria-live="polite"></p>
            </form>
          </div>

          <div class="col-lg-6">
            <form id="bookingForm" class="contact-form">
              <h2>Booking Form</h2>

              <label for="bookingName">Name</label>
              <input id="bookingName" name="name" type="text" required>

              <label for="bookingEmail">Email</label>
              <input id="bookingEmail" name="email" type="email" required>

              <label for="eventDate">Event date</label>
              <input id="eventDate" name="date" type="date" required>

              <label for="guests">Number of people</label>
              <input id="guests" name="guests" type="number" min="1" max="100" value="1" required>

              <label for="package">Package</label>
              <select id="package" name="package" required>
                <option value="225">Deluxe — R225 per person</option>
                <option value="200">Standard — R200 per person</option>
                <option value="150">Backpacker — R150 per person</option>
                <option value="150">Family —  R150 per person</option>

              </select>

              <p class="estimated-total">
                Estimated total: <strong id="total">R250.00</strong>
              </p>

              <label for="details">Additional information</label>
              <textarea id="details" name="details" rows="4" maxlength="500"></textarea>

              <button class="btn btn-gold mt-3" type="submit">Submit booking</button>
              <p id="bookingMessage" class="message" aria-live="polite"></p>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="container">
      <p>“We travel not to escape life, but so life does not escape us.”</p>
      <p>&copy; 2026 Visit Lesotho</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const themeButton = document.getElementById("themeButton");

    themeButton.addEventListener("click", () => {
      const isDark = document.body.classList.toggle("dark-mode");
      themeButton.textContent = isDark ? "Light mode" : "Dark mode";
      themeButton.setAttribute("aria-pressed", String(isDark));
    });

    const registrationForm = document.getElementById("registrationForm");

    registrationForm.addEventListener("submit", (event) => {
      event.preventDefault();

      if (!registrationForm.reportValidity()) return;

      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      const message = document.getElementById("registrationMessage");

      if (password !== confirmPassword) {
        message.textContent = "Error: passwords do not match.";
        message.className = "message error";
        return;
      }

      message.textContent = "Registration successful!";
      message.className = "message success";
      registrationForm.reset();
    });

    const bookingForm = document.getElementById("bookingForm");
    const guestsInput = document.getElementById("guests");
    const packageSelect = document.getElementById("package");
    const totalDisplay = document.getElementById("total");

    function updateTotal() {
      const guests = Number(guestsInput.value) || 0;
      const price = Number(packageSelect.value) || 0;
      totalDisplay.textContent = `$${(guests * price).toFixed(2)}`;
    }

    guestsInput.addEventListener("input", updateTotal);
    packageSelect.addEventListener("change", updateTotal);

    bookingForm.addEventListener("submit", (event) => {
      event.preventDefault();

      if (!bookingForm.reportValidity()) return;

      const message = document.getElementById("bookingMessage");
      const eventDate = document.getElementById("eventDate").value;
      const selectedDate = new Date(`${eventDate}T00:00:00`);
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      if (selectedDate < today) {
        message.textContent = "Error: choose today’s date or a future date.";
        message.className = "message error";
        return;
      }

      message.textContent =
        `Booking submitted successfully. Estimated total: ${totalDisplay.textContent}.`;
      message.className = "message success";

      bookingForm.reset();
      updateTotal();
    });

    updateTotal();
  </script>
</body>
</html>
